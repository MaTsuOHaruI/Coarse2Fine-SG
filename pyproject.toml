[project]
name = "soilgsd"
version = "0.1.0"
description = "Soil grain size distributions from smartphone photos (CV final project, NSYSU)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pillow",
    "opencv-python-headless",
    "scikit-image",
    "pyyaml",
    "matplotlib",
    "pywavelets",
    # torch is left unpinned on purpose: Colab keeps its preinstalled CUDA build.
    "torch",
    "torchvision",
    "segment-anything",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["soilgsd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# The project lives on /mnt/c (Windows drive); hardlinks from the uv cache do not work there.
link-mode = "copy"
